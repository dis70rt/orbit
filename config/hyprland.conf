# Legacy hyprlang integration (also supported by this machine's Hyprland 0.56.2).
# Add: source = $HOME/Projects/Orbit/config/hyprland.conf
$orbit = $HOME/Projects/Orbit/bin/orbit
# Change the empty modifier to SUPER in BOTH bindings to preserve middle click.
exec-once = $orbit serve
bind = , mouse:274, exec, $orbit show
bindri = , mouse:274, exec, $orbit release

# Blur only Orbit's painted pixels. Global decoration blur must be enabled.
layerrule = blur on, match:namespace ^(orbit)$
layerrule = ignore_alpha 0.01, match:namespace ^(orbit)$
# Orbit supplies its own frame-clock transitions.
layerrule = no_anim on, match:namespace ^(orbit)$
